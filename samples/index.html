<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breadcrumbs Component</title>
    <link rel="stylesheet" href="https://cdn.brand.illinois.edu/illinois.css">
    <link rel="stylesheet" href="https://cdn.toolkit.illinois.edu/ilw-global/3/ilw-global.css">
    <script type="module" src="/src/ilw-breadcrumbs.js"></script>
    <script>
        let componentName = 'ilw-breadcrumbs';
        document.addEventListener("DOMContentLoaded", function(event) {
            const params = new URLSearchParams(window.location.search);
            document.querySelectorAll(componentName).forEach(component => {
            for (const key of params.keys()) {
                component.setAttribute(key, params.get(key));
            }
            });
        });
    </script>
</head>
<body style="margin: 0; padding: 0;">
<ilw-breadcrumbs>
    <a href="/">Home</a>
    <a href="/academics">Academics</a>
    <a href="/academics/undergraduate">Undergraduate programs</a>
    <span>Degree programs</span>
</ilw-breadcrumbs>
</body>
</html>
